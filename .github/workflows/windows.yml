name: Build Lucid for Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lucid-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test and package Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Engine tests
        run: cargo test --workspace --locked
        continue-on-error: false

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/lucid-browser.exe dist/lucid-browser.exe
          @'
          Lucid Browser is an experimental independent browser-engine project.
          This build is a UI shell and engine research prototype, not a production browser.
          '@ | Set-Content dist/README.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lucid-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
