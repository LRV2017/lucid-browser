name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lucid-windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Test and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run engine and application tests
        run: cargo test --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build release executable
        run: cargo build --release --package lucid-browser

      - name: Prepare portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/lucid-browser.exe dist/lucid-browser.exe
          Copy-Item README.md dist/README.txt
          Copy-Item LICENSE dist/LICENSE.txt
          Compress-Archive -Path dist/* -DestinationPath Lucid-Browser-Windows-x64.zip -Force

      - name: Upload Windows executable and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Lucid-Browser-Windows-x64
          path: |
            target/release/lucid-browser.exe
            Lucid-Browser-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
