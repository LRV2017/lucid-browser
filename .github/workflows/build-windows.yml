name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lucid-windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Test and build Windows x64 with Chromium
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize MSVC compiler environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Chromium native build tools
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --yes --no-progress
          }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake --yes --no-progress
          }

      - name: Run engine and application tests
        run: cargo test --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build Lucid Chromium client and launcher
        run: cargo build --release --package lucid-browser

      - name: Verify Chromium runtime and sandbox bootstrap
        shell: pwsh
        run: |
          $required = @(
            "target/release/bootstrap.exe",
            "target/release/lucid_browser.dll",
            "target/release/libcef.dll",
            "target/release/icudtl.dat",
            "target/release/resources.pak",
            "target/release/locales"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Required Chromium runtime file is missing: $path"
            }
          }

      - name: Prepare portable Chromium browser ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # CEF M138+ uses its bootstrap executable to load the sandboxed client DLL.
          Copy-Item target/release/bootstrap.exe dist/lucid_browser.exe
          Copy-Item target/release/lucid_browser.dll dist/lucid_browser.dll

          # Include the CEF/Chromium runtime libraries and data packs beside the bootstrap.
          Get-ChildItem target/release -File |
            Where-Object { $_.Extension -in @(".dll", ".pak", ".dat", ".bin") } |
            ForEach-Object { Copy-Item $_.FullName dist/ -Force }

          Copy-Item target/release/locales dist/locales -Recurse -Force
          Copy-Item README.md dist/README.txt
          Copy-Item LICENSE dist/LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.txt

          Compress-Archive -Path dist/* -DestinationPath Lucid-Browser-Windows-x64.zip -Force

      - name: Upload Windows Chromium executable and ZIP
        uses: actions/upload-artifact@v7
        with:
          name: Lucid-Browser-Windows-x64
          path: |
            dist/lucid_browser.exe
            dist/lucid_browser.dll
            Lucid-Browser-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
