[package]
name = "lucid-browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lucid_browser"
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.37.0", default-features = true }
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
lucid-engine = { path = "../../crates/lucid-engine" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.4"

[target.'cfg(target_os = "windows")'.dependencies]
cef = { version = "156.7.0", default-features = false, features = ["sandbox", "resources"] }
cef-dll-sys = { version = "156.7.0", features = ["sandbox"] }
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = ["Win32_Foundation"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

